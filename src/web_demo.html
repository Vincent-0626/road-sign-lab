<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>路标识别实验室</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#172d43;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:0 auto;padding:40px 24px 56px}.eyebrow{font-size:12px;color:#157663;letter-spacing:2px;font-weight:700}.header{display:flex;justify-content:space-between;align-items:end;gap:25px;margin-bottom:24px}h1{margin:10px 0 6px;font-size:34px;letter-spacing:-1px}.sub{color:#627385;font-size:14px;line-height:1.7;margin:0}.badge{border:1px solid #c4ded4;border-radius:30px;padding:8px 14px;color:#28745e;font-size:12px;white-space:nowrap;background:#f4fbf7}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.card{background:white;border:1px solid #e1e8eb;border-radius:14px;padding:22px;box-shadow:0 6px 26px #234a4510}h2{font-size:16px;margin:0 0 14px}.drop{height:340px;border:1.5px dashed #b8cbd0;border-radius:10px;background:#f7faf9;display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center;color:#718589}.drop img{width:min(100%,320px);height:min(100%,300px);object-fit:contain;display:none}.placeholder{line-height:1.8;font-size:14px}.placeholder b{display:block;color:#274b4a;font-size:17px}.file{margin-top:14px;width:100%;font-size:13px}.file::file-selector-button,button{background:#176e5b;border:0;color:white;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}.file::file-selector-button{margin-right:12px}label{display:block;margin:14px 0 7px;color:#526b76;font-size:13px}.slider{width:100%;accent-color:#167763}select{width:100%;border:1px solid #d5e0e2;background:#fff;border-radius:8px;padding:10px;color:#213f4c}input[type=checkbox]{accent-color:#18735e}.check{display:flex;align-items:center;gap:8px;margin:16px 0}.check label{margin:0}.run{width:100%;padding:13px;margin:4px 0 16px}.run:disabled{opacity:.5}.divider{height:1px;background:#e9eeee;margin:5px 0 18px}.result{font-size:14px;color:#617482;min-height:100px;line-height:1.8}.result strong{display:block;font-size:19px;color:#174638;margin:3px 0 12px}.row{display:flex;justify-content:space-between;padding:5px 0;color:#365261}.score{font-variant-numeric:tabular-nums}.note{background:#eaf3ef;border-radius:10px;padding:14px 16px;margin-top:16px;font-size:12px;line-height:1.8;color:#4d7163}.status{font-size:12px;color:#637f78;margin-top:9px;min-height:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}.header{display:block}.badge{display:inline-block;margin-top:14px}.drop{height:260px}}
</style>
</head>
<body><main class="wrap">
<div class="header"><div><div class="eyebrow">VISION LAB / TRAFFIC SIGNS</div><h1>路标识别实验室</h1><p class="sub">上传裁剪好的交通标志，观察图像干扰对模型结果的影响。</p></div><div class="badge">GTSRB · 43 类标志</div></div>
<div class="grid"><section class="card"><h2>输入图片</h2><div class="drop"><div class="placeholder" id="placeholder"><b>选择一张交通标志图片</b>支持 JPG、PNG、WEBP 等常见格式</div><img id="preview" alt="输入或处理后的交通标志"></div><input class="file" type="file" accept="image/*" id="file"><p class="status" id="status">请选择单个标志的裁剪图片。</p><button id="sample" type="button">使用停车标志示例</button></section>
<section class="card"><h2>场景干扰</h2><label for="brightness">亮度 <span id="brightness-value">1.0</span> ×</label><input class="slider" id="brightness" type="range" min="0.2" max="1.8" step="0.1" value="1"><label for="blur">模糊程度</label><select id="blur"><option value="0">无</option><option value="3">轻度</option><option value="5">中度</option><option value="7">重度</option></select><div class="check"><input type="checkbox" id="occlusion"><label for="occlusion">模拟局部遮挡</label></div><button class="run" id="run" disabled>开始分析</button><div class="divider"></div><h2>识别结果</h2><div class="result" id="result">选择图片后，可查看原图和干扰后的预测。</div></section></div>
<div class="note">模型使用德国 GTSRB 数据集的 43 类标志，输入应是单个标志的裁剪图片。当前版本不负责从整张道路图片中定位标志；分数是模型输出，不是校准后的正确率。</div>
</main><script>
const file=document.querySelector('#file'),preview=document.querySelector('#preview'),placeholder=document.querySelector('#placeholder'),run=document.querySelector('#run'),statusEl=document.querySelector('#status'),result=document.querySelector('#result'),brightness=document.querySelector('#brightness');let imageData='';
brightness.addEventListener('input',()=>document.querySelector('#brightness-value').textContent=Number(brightness.value).toFixed(1));
file.addEventListener('change',()=>{const selected=file.files[0];if(!selected)return;if(selected.size>7*1024*1024){statusEl.textContent='图片超过 7 MB，请选择较小的图片。';run.disabled=true;return}const reader=new FileReader();reader.onload=()=>{imageData=reader.result;preview.src=imageData;preview.style.display='block';placeholder.style.display='none';statusEl.textContent='已选择：'+selected.name;run.disabled=false};reader.readAsDataURL(selected)});
document.querySelector('#sample').addEventListener('click',async()=>{try{const response=await fetch('/api/sample');if(!response.ok)throw new Error('示例加载失败');const blob=await response.blob();const reader=new FileReader();reader.onload=()=>{imageData=reader.result;preview.src=imageData;preview.style.display='block';placeholder.style.display='none';statusEl.textContent='已选择停车标志示例';run.disabled=false};reader.readAsDataURL(blob)}catch(error){statusEl.textContent=error.message}});
run.addEventListener('click',async()=>{run.disabled=true;statusEl.textContent='正在分析…';try{const response=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:imageData,brightness:Number(brightness.value),blur:Number(document.querySelector('#blur').value),occlusion:document.querySelector('#occlusion').checked ? 0.3 : 0})});const data=await response.json();if(!response.ok)throw new Error(data.error||'分析失败');preview.src=data.modified_image;result.replaceChildren();const lead=document.createElement('div');lead.textContent='原图首选：'+data.original[0].name+' · '+(data.original[0].score*100).toFixed(1)+'%';result.appendChild(lead);const title=document.createElement('strong');title.textContent='当前图片的前三个候选';result.appendChild(title);data.modified.forEach((item,i)=>{const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.textContent=(i+1)+'. '+item.name;const score=document.createElement('span');score.className='score';score.textContent=(item.score*100).toFixed(1)+'%';row.append(name,score);result.appendChild(row)});statusEl.textContent='分析完成 · 已展示调整后的图片';}catch(error){statusEl.textContent=error.message||'连接失败，请确认服务正在运行。'}finally{run.disabled=false}});
</script></body></html>
